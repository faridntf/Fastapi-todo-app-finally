<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101713" />
    <title>صفحه پیدا نشد | روزنو</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Tahoma, "Segoe UI", sans-serif;
        color: #f3f6f1;
        background: #101713;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --green: #b9ef91;
        --muted: #9aa79b;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 45%, #1c2b20 0, #101713 48%, #0c110e 100%);
      }

      .page {
        position: relative;
        display: grid;
        width: min(100% - 40px, 760px);
        min-height: 590px;
        align-content: center;
        justify-items: center;
        padding: 64px 24px;
        text-align: center;
      }

      .brand {
        position: absolute;
        top: 34px;
        right: 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #eef4ec;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid #b9ef9130;
        border-radius: 11px;
        background: #b9ef9112;
        color: var(--green);
      }

      .brand-mark svg { width: 17px; height: 17px; }

      .illustration {
        position: relative;
        display: grid;
        width: 220px;
        height: 220px;
        margin-bottom: 14px;
        place-items: center;
      }

      .orbit, .orbit::before, .orbit::after {
        position: absolute;
        border: 1px solid #b9ef9126;
        border-radius: 50%;
        content: "";
      }

      .orbit { inset: 9px; transform: rotate(-28deg) scaleY(.55); }
      .orbit::before { inset: -20px 18px; transform: rotate(68deg); }
      .orbit::after { inset: 16px -14px; transform: rotate(-48deg); }

      .planet {
        position: relative;
        display: grid;
        width: 108px;
        height: 108px;
        place-items: center;
        border: 1px solid #c5f19e55;
        border-radius: 36px;
        background: linear-gradient(145deg, #273b2c, #18251c);
        box-shadow: 0 0 75px #a7e78120, inset 0 1px #ffffff12;
        color: var(--green);
        transform: rotate(-8deg);
      }

      .planet svg { width: 43px; height: 43px; transform: rotate(8deg); }

      .spark {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 18px #b9ef91a0;
      }

      .spark.one { top: 24px; left: 49px; width: 6px; height: 6px; }
      .spark.two { right: 15px; bottom: 57px; width: 5px; height: 5px; opacity: .7; }

      .code {
        margin: 0 0 7px;
        color: var(--green);
        font-family: "Segoe UI", sans-serif;
        font-size: clamp(72px, 15vw, 112px);
        font-weight: 800;
        letter-spacing: -8px;
        line-height: 1;
        text-shadow: 0 0 50px #b9ef911a;
      }

      h1 { margin: 17px 0 9px; font-size: clamp(21px, 4vw, 27px); font-weight: 700; }
      .description { max-width: 390px; margin: 0; color: var(--muted); font-size: 14px; line-height: 2; }

      .home-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        margin-top: 29px;
        padding: 0 21px;
        border: 1px solid #c9f4a3;
        border-radius: 14px;
        background: var(--green);
        color: #172116;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
        box-shadow: 0 8px 30px #b9ef911c;
      }

      .home-link:hover { transform: translateY(-2px); background: #d0f7b0; box-shadow: 0 12px 34px #b9ef912b; }
      .home-link svg { width: 17px; height: 17px; }

      .hint { margin-top: 18px; color: #69766c; font-size: 11px; }

      @media (max-width: 520px) {
        .page { min-height: 540px; padding-inline: 12px; }
        .brand { top: 22px; right: 4px; }
        .illustration { width: 190px; height: 190px; margin-bottom: 8px; }
        .planet { width: 96px; height: 96px; border-radius: 32px; }
        .description { font-size: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="/" aria-label="رفتن به صفحه اصلی روزنو">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>روزنو</span>
      </a>

      <div class="illustration" aria-hidden="true">
        <span class="orbit"></span>
        <span class="spark one"></span>
        <span class="spark two"></span>
        <span class="planet">
          <svg viewBox="0 0 48 48" fill="none"><path d="M14 16.5h20M14 24h13M14 31.5h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="34" cy="31" r="7" fill="#263c2a" stroke="currentColor" stroke-width="1.8"/><path d="m31.5 31 1.6 1.6 3.4-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>

      <p class="code" aria-label="خطای ۴۰۴">404</p>
      <h1>این صفحه پیدا نشد</h1>
      <p class="description">به نظر می‌رسد این مسیر وجود ندارد یا جابه‌جا شده. از اینجا می‌توانی دوباره راهت را پیدا کنی.</p>
      <a class="home-link" href="/">
        <span>بازگشت به صفحهٔ اصلی</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m0 0 6 6m-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="hint">گاهی یک قدم به عقب، بهترین راه برای ادامه است.</p>
    </main>
  </body>
</html>
